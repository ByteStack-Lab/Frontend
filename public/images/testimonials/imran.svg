<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </radialGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="60" fill="url(#bg3)"/>
  
  <!-- Face -->
  <circle cx="60" cy="50" r="25" fill="#d97706"/>
  
  <!-- Hair (Male style) -->
  <path d="M35 40 Q35 20 60 20 Q85 20 85 40 Q80 35 60 35 Q40 35 35 40" fill="#1f2937"/>
  <rect x="45" y="20" width="30" height="25" fill="#1f2937" rx="15"/>
  
  <!-- Eyes -->
  <circle cx="52" cy="45" r="2.5" fill="#1f2937"/>
  <circle cx="68" cy="45" r="2.5" fill="#1f2937"/>
  <circle cx="52.5" cy="44.5" r="0.8" fill="#ffffff"/>
  <circle cx="68.5" cy="44.5" r="0.8" fill="#ffffff"/>
  
  <!-- Eyebrows (Thicker for male) -->
  <rect x="47" y="39" width="10" height="2" fill="#1f2937" rx="1"/>
  <rect x="63" y="39" width="10" height="2" fill="#1f2937" rx="1"/>
  
  <!-- Nose -->
  <ellipse cx="60" cy="52" rx="1.5" ry="2" fill="#b45309"/>
  
  <!-- Mouth (Neutral) -->
  <line x1="56" y1="58" x2="64" y2="58" stroke="#7c2d12" stroke-width="2"/>
  
  <!-- Beard -->
  <path d="M45 60 Q60 70 75 60 Q70 65 60 65 Q50 65 45 60" fill="#1f2937"/>
  
  <!-- Body/Clothing -->
  <rect x="40" y="75" width="40" height="45" fill="#10b981" rx="20"/>
  
  <!-- Glasses -->
  <circle cx="52" cy="45" r="8" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="68" cy="45" r="8" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="45" x2="60" y2="45" stroke="#374151" stroke-width="2"/>
</svg> 