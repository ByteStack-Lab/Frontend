  <circle cx="50" cy="32" r="7" fill="#8b4513"/>
  <circle cx="70" cy="32" r="7" fill="#8b4513"/>
  
  <!-- Eyes -->
  <circle cx="52" cy="45" r="2.5" fill="#1f2937"/>
