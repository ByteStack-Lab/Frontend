<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B46C1"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="80" fill="white" rx="8"/>
  
  <!-- Company Name -->
  <text x="100" y="30" text-anchor="middle" fill="url(#gradient1)" font-family="Arial, sans-serif" font-size="16" font-weight="bold">SAMPATH</text>
  <text x="100" y="50" text-anchor="middle" fill="url(#gradient1)" font-family="Arial, sans-serif" font-size="12" font-weight="600">CREAM HOUSE</text>
  
  <!-- Decorative element -->
  <circle cx="30" cy="40" r="8" fill="url(#gradient1)" opacity="0.3"/>
  <circle cx="170" cy="40" r="6" fill="url(#gradient1)" opacity="0.3"/>
</svg> 