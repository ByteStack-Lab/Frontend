<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="overlay-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000" stop-opacity="0.2"/>
      <stop offset="100%" style="stop-color:#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-gradient)"/>
  
  <!-- Overlay -->
  <rect width="800" height="450" fill="url(#overlay-gradient)"/>
  
  <!-- Play button background circle -->
  <circle cx="400" cy="225" r="50" fill="white" opacity="0.9"/>
  
  <!-- Play icon -->
  <polygon points="380,200 380,250 430,225" fill="#667eea"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="100" r="20" fill="white" opacity="0.1"/>
  <circle cx="650" cy="350" r="15" fill="white" opacity="0.1"/>
  <circle cx="700" cy="80" r="25" fill="white" opacity="0.1"/>
  
  <!-- Company logo/text placeholder -->
  <text x="400" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold" opacity="0.8">ByteStack Lab</text>
  <text x="400" y="350" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" opacity="0.6">Company Introduction Video</text>
</svg> 