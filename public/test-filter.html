<!DOCTYPE html>
<html>
<head>
    <title>Blog Category Filter Test</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>Blog Category Filter Test</h1>
        
        <div v-if="loading">Loading...</div>
        
        <div v-else>
            <h3>Categories:</h3>
            <button @click="selectedCategory = null" 
                    :style="selectedCategory === null ? 'background: blue; color: white' : ''">
                All Posts ({{ blogs.length }})
            </button>
            <button v-for="category in categories" 
                    :key="category"
                    @click="selectedCategory = category"
                    :style="selectedCategory === category ? 'background: blue; color: white' : ''"
                    style="margin-left: 10px;">
                {{ category }} ({{ getCategoryCount(category) }})
            </button>
            
            <h3>Filtered Blogs ({{ filteredBlogs.length }}):</h3>
            <div v-for="blog in filteredBlogs" :key="blog.id" style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
                <h4>{{ blog.title }}</h4>
                <p><strong>Categories:</strong> 
                    <span v-for="cat in blog.categories" :key="cat.id">{{ cat.name }} </span>
                </p>
                <p><strong>Single Category:</strong> {{ blog.category }}</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        
        createApp({
            setup() {
                const blogs = ref([]);
                const categories = ref([]);
                const selectedCategory = ref(null);
                const loading = ref(true);
                
                const filteredBlogs = computed(() => {
                    console.log('Filtering with:', selectedCategory.value);
                    if (!selectedCategory.value) return blogs.value;
                    
                    return blogs.value.filter(blog => {
                        if (blog.categories && Array.isArray(blog.categories)) {
                            return blog.categories.some(cat => {
                                if (typeof cat === 'object' && cat !== null) {
                                    return cat.name === selectedCategory.value;
                                }
                                return cat === selectedCategory.value;
                            });
                        }
                        return blog.category === selectedCategory.value;
                    });
                });
                
                const getCategoryCount = (categoryName) => {
                    return blogs.value.filter(blog => {
                        if (blog.categories && Array.isArray(blog.categories)) {
                            return blog.categories.some(cat => {
                                if (typeof cat === 'object' && cat !== null) {
                                    return cat.name === categoryName;
                                }
                                return cat === categoryName;
                            });
                        }
                        return blog.category === categoryName;
                    }).length;
                };
                
                const fetchData = async () => {
                    try {
                        // Fetch blogs
                        const blogsResponse = await fetch('http://127.0.0.1:8000/api/blogs');
                        const blogsData = await blogsResponse.json();
                        blogs.value = blogsData.data;
                        
                        // Fetch categories
                        const categoriesResponse = await fetch('http://127.0.0.1:8000/api/blogs/categories');
                        const categoriesData = await categoriesResponse.json();
                        categories.value = categoriesData.data.map(cat => cat.name);
                        
                        console.log('Blogs loaded:', blogs.value.length);
                        console.log('Categories loaded:', categories.value);
                        console.log('Sample blog categories:', blogs.value[0]?.categories);
                        
                    } catch (error) {
                        console.error('Error fetching data:', error);
                    } finally {
                        loading.value = false;
                    }
                };
                
                onMounted(fetchData);
                
                return {
                    blogs,
                    categories,
                    selectedCategory,
                    loading,
                    filteredBlogs,
                    getCategoryCount
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
